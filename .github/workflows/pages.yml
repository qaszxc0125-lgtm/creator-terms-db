name: Validate and deploy Creator Terms DB

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "**/*.html"
      - "database.json"
      - "README.txt"
      - "sitemap.xml"
      - "robots.txt"
      - "scripts/validate_database.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate database and HTML sync
        run: python3 scripts/validate_database.py

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Exclude repository-only progress file from the published site
        run: rm -f PROJECT-STATE.md
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
